name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: MSBuild Release x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Discover Windows SDK paths
        id: sdk
        shell: pwsh
        run: |
          Write-Host "Searching for d3d9.lib (x64) / d3d9.h ..."
          $d3d9Lib = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Recurse -Filter d3d9.lib -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\um\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          $d3d9Hdr = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Recurse -Filter d3d9.h -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\um\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $d3d9Lib) {
            $d3d9Lib = Get-ChildItem "${env:ProgramFiles(x86)}" -Recurse -Filter d3d9.lib -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $d3d9Lib) {
            Write-Error "d3d9.lib not found"
            exit 1
          }

          $umInclude = if ($d3d9Hdr) { $d3d9Hdr.DirectoryName } else { "" }
          $sharedInclude = if ($d3d9Hdr) { Join-Path $d3d9Hdr.Directory.Parent.FullName "shared" } else { "" }

          Write-Host "d3d9.lib = $d3d9Lib"
          "d3d9_lib=$d3d9Lib" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "um_include=$umInclude" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "shared_include=$sharedInclude" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Patch project for CI
        shell: pwsh
        env:
          D3D9_LIB: ${{ steps.sdk.outputs.d3d9_lib }}
          UM_INC: ${{ steps.sdk.outputs.um_include }}
          SHARED_INC: ${{ steps.sdk.outputs.shared_include }}
        run: |
          $vcx = "Source\D3D9 Overlay ImGui\D3D9 Overlay ImGui.vcxproj"
          $pch = "Source\D3D9 Overlay ImGui\pch.h"

          $pchText = Get-Content $pch -Raw
          $pchText = $pchText -replace '#include\s+"d3dx9\.h"', '// d3dx9 removed for CI'
          $pchText = $pchText -replace '#include\s+"d3d9\.h"', '#include <d3d9.h>'
          Set-Content -Path $pch -Value $pchText -NoNewline

          $xml = Get-Content $vcx -Raw
          $xml = $xml.Replace('$(DXSDK_DIR)Include;', "$env:UM_INC;$env:SHARED_INC;")

          $deps = "$env:D3D9_LIB;shell32.lib;dwmapi.lib;winhttp.lib;%(AdditionalDependencies)"
          $xml = [regex]::Replace($xml,
            '<AdditionalDependencies>[\s\S]*?</AdditionalDependencies>',
            "<AdditionalDependencies>$deps</AdditionalDependencies>")

          Set-Content -Path $vcx -Value $xml -NoNewline

      - name: Build (Release x64)
        working-directory: Source
        shell: cmd
        run: |
          msbuild "D3D9 Overlay ImGui.sln" /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /verbosity:minimal

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: D3D9-Overlay-ImGui-x64-Release
          path: |
            Source/**/x64/Release/*.exe
            Source/**/Release/*.exe
          if-no-files-found: warn
